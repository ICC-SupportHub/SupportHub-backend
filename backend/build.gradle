plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.supporthub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Spring Boot 기본 ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'      // WebClient (OpenAI 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator' // ← /actuator/health 사용 시 필요
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'


	// --- DB ---
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- JWT (io.jsonwebtoken: jjwt 0.11.x) ---
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JSON 직렬화 지원

	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- 개발 편의 ---
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- 테스트 ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// --- OpenAI 통신 (WebClient 기반) ---
	// 별도 SDK 불필요. Spring WebFlux(WebClient)로 직접 호출.
	// 만약 공식 SDK(OpenAI Java)를 쓰고 싶다면 아래를 대신 추가:
	// implementation 'com.openai:openai-java:4.6.1'
	// implementation 'com.openai:openai-java-client-okhttp:4.6.1'
}

/* (선택) Swagger(OpenAPI 문서 UI)
dependencies {
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
}
*/

tasks.named('test') {
	useJUnitPlatform()
}
